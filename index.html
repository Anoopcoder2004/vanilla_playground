<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Callback Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        input {
            display: block;
            margin: 10px 0;
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            color: blue;
        }
    </style>
</head>
<body>

    <h2>Login Callback Demo</h2>

    <input
        type="text"
        id="username"
        placeholder="Enter Username"
    >

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
    >

    <button id="loginBtn">Login</button>

    <p id="status"></p>

    <script src="script.js"></script>

</body>
</html>
