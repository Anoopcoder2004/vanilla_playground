<!DOCTYPE html>
<html>
<head>
    <title>Call Stack Demo</title>
</head>
<body>

<button onclick="start()">Run</button>

<script>
function first() {
    console.log("Inside first");
}

function second() {
    first();
    console.log("Inside second");
}

function start() {
    second();
    console.log("Inside start");
}
</script>

</body>
</html>
